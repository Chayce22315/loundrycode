name: foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-test:
    name: swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-latest

    steps:
      - name: check out loundrycode
        uses: actions/checkout@v4

      - name: select swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: build
        run: swift build

      - name: test
        run: swift test
