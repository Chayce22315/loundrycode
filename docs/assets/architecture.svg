<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">loundrycode architecture</title>
  <desc id="desc">a diagram showing the idea flowing through loundy, planning, agents, a real execution environment, testing, and retrying</desc>
  <rect width="1100" height="520" rx="32" fill="#111318"/>
  <g fill="#20242c" stroke="#f2f2f2" stroke-width="2">
    <rect x="55" y="205" width="150" height="75" rx="18"/>
    <rect x="245" y="205" width="150" height="75" rx="18"/>
    <rect x="435" y="205" width="150" height="75" rx="18"/>
    <rect x="625" y="205" width="190" height="75" rx="18"/>
    <rect x="855" y="120" width="175" height="75" rx="18"/>
    <rect x="855" y="315" width="175" height="75" rx="18"/>
  </g>
  <g fill="#f2f2f2" font-family="monospace" font-size="22" text-anchor="middle">
    <text x="130" y="250">your idea</text>
    <text x="320" y="250">loundy core</text>
    <text x="510" y="250">planner + agents</text>
    <text x="720" y="238">ai's environment</text>
    <text x="720" y="263">compile + test</text>
    <text x="942" y="165">success</text>
    <text x="942" y="360">diagnose + fix</text>
  </g>
  <g fill="none" stroke="#f2f2f2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 242 H245"/>
    <path d="M395 242 H435"/>
    <path d="M585 242 H625"/>
    <path d="M815 220 L855 158"/>
    <path d="M855 352 L815 270"/>
    <path d="M942 315 V195"/>
  </g>
  <g fill="#f2f2f2" font-family="monospace" font-size="18">
    <text x="550" y="80" text-anchor="middle" font-size="32" font-weight="700">loundrycode execution loop</text>
    <text x="550" y="115" text-anchor="middle">plan → build → run → test → fix → try again</text>
  </g>
</svg>
